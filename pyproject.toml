[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "btp-mcp-server"
version = "1.0.0"
description = "MCP server for SAP BTP Services Discovery"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["mcp", "sap", "btp", "llm", "ai-agent", "claude"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "fastmcp>=2.0.0",
    "pydantic>=2.0.0",
    "cachetools>=5.3.0",
]

[project.scripts]
btp-mcp-server = "btp_mcp.server:main"

[project.urls]
Homepage = "https://github.com/ABRANJAN07/btp-mcp-server"
Repository = "https://github.com/ABRANJAN07/btp-mcp-server"

[tool.setuptools.packages.find]
where = ["."]
include = ["btp_mcp*"]